<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>U23 – Downloads</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f6f7f9; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 48px 20px; text-align: center; }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 0 0 28px; color: #444; }
    .btns { display: grid; gap: 14px; }
    a.btn {
      display: block; padding: 16px 18px; border-radius: 12px; text-decoration: none;
      background: #0d2e1e; color: #fff; font-size: 18px; font-weight: 600;
    }
    a.btn.secondary { background: #1f6f4a; }
    .note { margin-top: 18px; font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>U23 – PDF Downloads</h1>
    <p>Select your language to download the document.</p>

    <div class="btns">
      <a class="btn secondary" href="files/U23-Guide-AR.pdf" download>Download (Arabic) – تحميل عربي</a>
      <a class="btn" href="files/U23-Guide-EN.pdf" download>Download (English)</a>
    </div>

    <div class="note">If the file opens in the browser, use the download icon.</div>
  </div>
</body>
</html>
